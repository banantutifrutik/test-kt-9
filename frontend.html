<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Регистрация и Профиль</title>
    <style>
        body { font-family: Arial; background-color: #f0f0f0; padding: 20px; }
        .box { background: white; padding: 20px; border-radius: 8px; width: 300px; margin: 0 auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: blue; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: darkblue; }
        #result { margin-top: 10px; font-weight: bold; color: green; }
    </style>
</head>
<body>

<div class="box">
    <h2>Регистрация</h2>
    <input type="text" id="username" placeholder="Логин (мин. 3 символа)">
    <input type="password" id="password" placeholder="Пароль (мин. 8 символов)">
    <input type="email" id="email" placeholder="Email (например, test@mail.ru)">
    <input type="text" id="name" placeholder="Имя">
    <button onclick="register()">Зарегистрироваться</button>
    <div id="result"></div>
</div>

<script>
    async function register() {
        const data = {
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            email: document.getElementById('email').value,
            name: document.getElementById('name').value
        };

        try {
            // ВАЖНО: Мы используем ОТНОСИТЕЛЬНЫЙ путь /api/register 
            // Так как страница открыта на том же порту (8000), браузер сам подставит правильный адрес.
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (response.ok) {
                document.getElementById('result').style.color = 'green';
                document.getElementById('result').innerText = 'Успешно! Токен: ' + result.access_token;
            } else {
                document.getElementById('result').style.color = 'red';
                
                // Если сервер вернул ошибку валидации (422), показываем её красиво
                if (response.status === 422) {
                    document.getElementById('result').innerText = 'Ошибка валидации: проверьте длину логина (3+) и пароля (8+), а также формат Email.';
                } else {
                    document.getElementById('result').innerText = 'Ошибка: ' + (result.detail || 'Проверьте данные');
                }
            }
        } catch (error) {
            document.getElementById('result').style.color = 'red';
            document.getElementById('result').innerText = 'Ошибка JS: ' + error.message;
        }
    }
</script>

</body>
</html>
